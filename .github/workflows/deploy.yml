name: Deploy Smart Home Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production static bundle
        run: npm run build
        # Opsional: Jika ingin menyuntikkan placeholder/broker via GitHub Secrets saat build:
        # env:
        #   VITE_MQTT_BROKER: ${{ secrets.VITE_MQTT_BROKER }}
        #   VITE_MQTT_USERNAME: ${{ secrets.VITE_MQTT_USERNAME }}
        #   VITE_MQTT_PASSWORD: ${{ secrets.VITE_MQTT_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
